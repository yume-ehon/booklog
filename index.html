<script type="module">
  function showInitError(msg){
    document.addEventListener('DOMContentLoaded', ()=>{
      const panel = document.getElementById('debugPanel');
      if(panel){
        panel.style.display = 'block';
        panel.textContent += 'Firebase初期化エラー: ' + msg + '\n';
      }
    });
    if(document.readyState !== 'loading'){
      const panel = document.getElementById('debugPanel');
      if(panel){
        panel.style.display = 'block';
        panel.textContent += 'Firebase初期化エラー: ' + msg + '\n';
      }
    }
  }
  try{
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const { getFirestore, collection, doc, setDoc, getDoc, getDocs, deleteDoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");

    const firebaseConfig = {
      apiKey: "AIzaSyBaXJLfFCljN5omZOSy6Nld0cetqj-wXRo",
      authDomain: "booklog-740ea.firebaseapp.com",
      projectId: "booklog-740ea",
      storageBucket: "booklog-740ea.firebasestorage.app",
      messagingSenderId: "423731234661",
      appId: "1:423731234661:web:1c1fe611c1ce8e5fb3838c"
    };

    const fbApp = initializeApp(firebaseConfig);
    const db = getFirestore(fbApp);
    const BOOKS_COLLECTION = "book-entries";

    // Expose a small wrapper matching the app's existing storage-adapter shape,
    // so the rest of the app doesn't need to know about Firestore directly.
    window.firebaseBookStorage = {
      async set(key, value){
        const id = key.replace(/^book-entry:/, '');
        await setDoc(doc(db, BOOKS_COLLECTION, id), JSON.parse(value));
        return {key, value};
      },
      async get(key){
        const id = key.replace(/^book-entry:/, '');
        const snap = await getDoc(doc(db, BOOKS_COLLECTION, id));
        if(!snap.exists()) throw new Error('not found');
        return {key, value: JSON.stringify(snap.data())};
      },
      async delete(key){
        const id = key.replace(/^book-entry:/, '');
        await deleteDoc(doc(db, BOOKS_COLLECTION, id));
        return {key, deleted:true};
    },
    async list(prefix){
      const snaps = await getDocs(collection(db, BOOKS_COLLECTION));
      const keys = [];
      window.firebaseBookStorage._cache = window.firebaseBookStorage._cache || {};
      snaps.forEach(d => {
        keys.push('book-entry:' + d.id);
        window.firebaseBookStorage._cache['book-entry:' + d.id] = JSON.stringify(d.data());
      });
      return {keys};
    },
    async getCached(key){
      if(window.firebaseBookStorage._cache && window.firebaseBookStorage._cache[key]){
        return {key, value: window.firebaseBookStorage._cache[key]};
      }
      return window.firebaseBookStorage.get(key);
    }
  };
    window.firebaseReadyFlag = true;
    window.dispatchEvent(new Event('firebase-ready'));
  }catch(err){
    console.error('Firebase init failed', err);
    showInitError(err.message || String(err));
  }
</script>

<div id="debugPanel" style="display:none;position:fixed;bottom:0;left:0;right:0;max-height:40vh;overflow:auto;background:#1a1a1a;color:#ff8080;font-family:monospace;font-size:11px;padding:10px;z-index:500;white-space:pre-wrap;"></div>

<script>
// On-page debug panel (mobile browsers have no dev console visible).
function setStatus(msg){
  const bar = document.getElementById('statusBar');
  if(bar) bar.textContent = msg;
}
setStatus('起動中... storage=' + (window.storage ? 'artifact' : 'ブラウザ') + ' / firebaseReady=' + !!window.firebaseReadyFlag);

function logDebug(msg){
  const panel = document.getElementById('debugPanel');
  panel.style.display = 'block';
  panel.textContent += msg + '\n';
}
window.addEventListener('error', (e)=>{
  logDebug('ERROR: ' + e.message);
});
window.addEventListener('unhandledrejection', (e)=>{
  logDebug('PROMISE ERROR: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
});

let html5QrCode = null;
let currentISBN = "";
const STORAGE_KEY_PREFIX = "book-entry:";

// Storage adapter: uses Claude artifact storage if present, otherwise
// falls back to localStorage so the app works when hosted on GitHub Pages.
const localBookStorage = {
  async set(key, value){
    try{ localStorage.setItem(key, value); return {key, value}; }
    catch(e){ console.error(e); return null; }
  },
  async get(key){
    const v = localStorage.getItem(key);
    if(v === null) throw new Error('not found');
    return {key, value: v};
  },
  async delete(key){
    localStorage.removeItem(key);
    return {key, deleted:true};
  },
  async list(prefix){
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(prefix)) keys.push(k);
    }
    return {keys};
  }
};
let bookStorage = (window.storage) ? window.storage : localBookStorage;

function showToast(msg){

let titleSearchAccumulated = [];
let titleSearchTotalItems = 0;
let titleSearchStartIndex = 0;
let titleSearchQuery = '';

async function doTitleSearch(){
  const q = document.getElementById('titleSearchInput').value.trim();
  const statusEl = document.getElementById('titleSearchStatus');
  const resultsEl = document.getElementById('titleSearchResults');
  resultsEl.innerHTML = '';
  if(!q){
    statusEl.textContent = 'タイトルを入力してください';
    return;
  }
  titleSearchAccumulated = [];
  titleSearchStartIndex = 0;
  titleSearchQuery = q;
  await fetchTitleSearchPage();
}

async function fetchTitleSearchPage(retryCount){
  retryCount = retryCount || 0;
  const statusEl = document.getElementById('titleSearchStatus');
  const resultsEl = document.getElementById('titleSearchResults');
  statusEl.textContent = titleSearchAccumulated.length > 0 ? '続きを読み込み中…' : '検索中…';
  try{
    // No field restriction (intitle:/inauthor:) — a plain query matches
    // both title and author, so one search box covers both cases.
    const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(titleSearchQuery)}&maxResults=40&startIndex=${titleSearchStartIndex}&key=${GOOGLE_BOOKS_API_KEY}`);
    if(!res.ok){
      // 500/503 etc. are usually transient — retry once before giving up.
      if(res.status >= 500 && retryCount < 1){
        await new Promise(r => setTimeout(r, 800));
        return fetchTitleSearchPage(retryCount + 1);
      }
      logDebug('タイトル検索エラー: HTTP ' + res.status);
      if(titleSearchAccumulated.length > 0){
        // We already have results from earlier pages — keep them visible
        // and just note that deeper results aren't available right now,
        // instead of overwriting the list with an error.
        statusEl.textContent = `${titleSearchAccumulated.length}件表示中（これ以上は今読み込めませんでした）`;
        renderTitleSearchResults(false);
      } else {
        statusEl.textContent = `検索に失敗しました（HTTP ${res.status}）`;
      }
      return;
    }
    const data = await res.json();
    titleSearchTotalItems = data.totalItems || 0;
    const newItems = (data.items || []).filter(it => it.volumeInfo && it.volumeInfo.title);
    titleSearchAccumulated = titleSearchAccumulated.concat(newItems);

    if(titleSearchAccumulated.length === 0){
      statusEl.textContent = '見つかりませんでした。ISBN手入力かバーコード読み取りをお試しください。';
      return;
    }
    statusEl.textContent = `${titleSearchAccumulated.length}件表示中（全${titleSearchTotalItems}件中）`;
    // Google Books' reported totalItems is often far larger than what it
    // will actually let you page through — if a page comes back with no
    // new items despite claiming more exist, treat that as the practical end.
    renderTitleSearchResults(newItems.length > 0);
  }catch(e){
    console.error(e);
    if(titleSearchAccumulated.length > 0){
      statusEl.textContent = `${titleSearchAccumulated.length}件表示中（これ以上は今読み込めませんでした）`;
      renderTitleSearchResults(false);
    } else {
      statusEl.textContent = '検索に失敗しました';
    }
    logDebug('タイトル検索通信エラー: ' + e.message);
  }
}

function renderTitleSearchResults(allowMore){
  allowMore = allowMore !== false;
  const resultsEl = document.getElementById('titleSearchResults');
  const items = titleSearchAccumulated;
  const hasMore = allowMore && titleSearchAccumulated.length < titleSearchTotalItems;
  resultsEl.innerHTML = items.map((it, idx)=>{
    const info = it.volumeInfo;
    const author = info.authors ? info.authors.join(', ') : '著者不明';
    const year = info.publishedDate ? info.publishedDate.slice(0,4) : '';
    return `<div class="title-result-item" id="titleResult_${idx}">
      <b>${escapeHtml(info.title)}${info.subtitle ? ' — ' + escapeHtml(info.subtitle) : ''}</b>
      ${escapeHtml(author)}${year ? ' / ' + escapeHtml(year) + '年' : ''}
    </div>`;
  }).join('') + (hasMore ? `<button class="save-btn" id="titleSearchMoreBtn" style="margin-top:6px;">もっと見る（残り${titleSearchTotalItems - items.length}件）</button>` : '');

  items.forEach((it, idx)=>{
    document.getElementById(`titleResult_${idx}`).addEventListener('click', ()=>{
      selectTitleSearchResult(it);
    });
  });
  if(hasMore){
    document.getElementById('titleSearchMoreBtn').addEventListener('click', ()=>{
      titleSearchStartIndex = titleSearchAccumulated.length;
      fetchTitleSearchPage();
    });
  }
}

function selectTitleSearchResult(item){
  const info = item.volumeInfo;
  const title = info.subtitle ? `${info.title}: ${info.subtitle}` : info.title;
  const author = info.authors ? info.authors.join(', ') : '';
  const ids = info.industryIdentifiers || [];
  const isbn13 = ids.find(i => i.type === 'ISBN_13');
  const isbn10 = ids.find(i => i.type === 'ISBN_10');

  document.getElementById('titleDisplay').textContent = title;
  document.getElementById('titleInput').value = title;
  document.getElementById('authorInput').value = author;
  document.getElementById('priceInput').value = '';
  document.getElementById('placeInput').value = '';
  document.getElementById('dateUnknownCheck').checked = false;
  document.getElementById('dateInput').disabled = false;
  document.getElementById('dupWarning').style.display = 'none';
  const today = new Date();
  document.getElementById('dateInput').value = today.toISOString().slice(0,10);
  checkDuplicates(title, isbn);
}

  loadEntries();
});

// Scanner state machine: idle -> starting -> running -> stopping -> idle.
// This avoids the "already under transition" error, which happens when
// start()/stop() are called on the underlying camera before the previous
// one has actually finished.
let scannerState = 'idle';
let scannerCloseRequested = false;

function openScanner(){
  if(scannerState !== 'idle'){
    // A start/stop transition is already in progress — ignore rapid
    // repeat taps rather than starting a second, conflicting camera session.
    return;
  }
  scannerCloseRequested = false;
  scannerState = 'starting';
  document.getElementById('reader-modal').classList.add('open');
  html5QrCode = new Html5Qrcode("reader", {
    // Limiting to barcode formats (skip QR/other 2D codes) makes
    // per-frame detection noticeably faster on mobile.
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E
    ],
    verbose: false
  });
  // Resolution hints belong in videoConstraints here — the first argument
  // to start() must contain exactly one key (facingMode OR deviceId).
  const config = {
    fps: 15,
    qrbox: { width: 280, height: 150 },
    disableFlip: true,
    videoConstraints: {
      facingMode: "environment",
      width: { ideal: 1280 },
      height: { ideal: 720 }
    }
  };
  html5QrCode.start(
    { facingMode: "environment" },
    config,
    (decodedText) => {
      onScanSuccess(decodedText);
    },
    (errorMessage) => { /* ignore per-frame scan errors */ }
  ).then(()=>{
    scannerState = 'running';
    // The user tapped close while the camera was still starting up —
    // finish starting, then immediately stop it as originally requested.
    if(scannerCloseRequested){
      closeScanner();
    }
  }).catch((err)=>{
    scannerState = 'idle';
    showToast("カメラを起動できませんでした");
    console.error(err);
    logDebug('カメラ起動エラー: ' + (err.message || err));
  });
}

function closeScanner(){
  document.getElementById('reader-modal').classList.remove('open');
  if(scannerState === 'starting'){
    // Can't stop yet — the start() transition hasn't resolved. Remember
    // to stop as soon as it does (handled in openScanner's .then above).
    scannerCloseRequested = true;
    return;
  }
  if(scannerState !== 'running' || !html5QrCode){
    return;
  }
  scannerState = 'stopping';
  stopScannerWithRetry(2);
}

function stopScannerWithRetry(attemptsLeft){
  html5QrCode.stop()
    .then(()=>html5QrCode.clear())
    .then(()=>{ scannerState = 'idle'; })
    .catch((err)=>{
      // html5-qrcode can throw "already under transition" if stop() is
      // called while it's still mid-frame internally (most common right
      // after a successful decode). A short retry almost always succeeds.
      if(attemptsLeft > 0){
        setTimeout(()=> stopScannerWithRetry(attemptsLeft - 1), 300);
      } else {
        console.error('scanner stop failed after retries', err);
        scannerState = 'idle';
      }
    });
}

function onScanSuccess(text){
  // Defer the stop slightly instead of calling it synchronously inside the
  // decode callback — doing it immediately is what most often triggers the
  // "already under transition" error inside html5-qrcode.
  setTimeout(()=> closeScanner(), 80);
  // Extract digits only, ISBNs are 13 (or 10) digits
  const digits = text.replace(/[^0-9]/g, "");
  openFormWithISBN(digits || text);
}

// ---- Duplicate detection (exact ISBN / exact / prefix / suffix / partial title match) ----
function findDuplicateCandidates(title, isbn){
  const t = (title || '').trim().toLowerCase();
  if(!t && !isbn) return [];
  const rank = { isbn: 0, exact: 1, prefix: 2, suffix: 3, partial: 4 };
  const labels = { isbn: 'ISBN一致', exact: '完全一致', prefix: '前方一致', suffix: '後方一致', partial: '部分一致' };
  const best = new Map();

  allEntriesCache.forEach(en=>{
    let type = null;
    if(isbn && en.isbn && en.isbn === isbn){
      type = 'isbn';
    } else {
      const et = (en.title || '').trim().toLowerCase();
      if(!et || !t) return;
      if(et === t) type = 'exact';
      else if(et.startsWith(t) || t.startsWith(et)) type = 'prefix';
      else if(et.endsWith(t) || t.endsWith(et)) type = 'suffix';
      else if(et.includes(t) || t.includes(et)) type = 'partial';
    }
    if(!type) return;
    const existing = best.get(en.id);
    if(!existing || rank[type] < rank[existing.type]){
      best.set(en.id, { entry: en, type });
    }
  });

  return Array.from(best.values())
    .sort((a,b)=> rank[a.type] - rank[b.type])
    .slice(0, 5)
    .map(x => ({ ...x, label: labels[x.type] }));
}

function checkDuplicates(title, isbn){
  const panel = document.getElementById('dupWarning');
  const candidates = findDuplicateCandidates(title, isbn);
  if(candidates.length === 0){
    panel.style.display = 'none';
    panel.innerHTML = '';
    return;
  }
  panel.style.display = 'block';
  panel.innerHTML = '⚠️ 似ている本がすでに登録されています<br>' + candidates.map(c=>{
    const en = c.entry;
    const dateText = en.dateUnknown ? '不明' : (en.date || '－');
    const priceText = en.price ? `¥${Number(en.price).toLocaleString()}` : '－';
    return `<div style="margin-top:6px;padding-top:6px;border-top:1px dashed var(--stamp);">
      <b>[${c.label}]</b> ${escapeHtml(en.title)}<br>
      購入日 ${escapeHtml(dateText)} / 価格 ${escapeHtml(priceText)}
    </div>`;
  }).join('');
}

async function lookupBook(isbn){
  const statusEl = document.getElementById('lookupStatus');
  statusEl.style.display = 'block';
  try{
    const res = await fetch(`https://api.openbd.jp/v1/get?isbn=${encodeURIComponent(isbn)}`);
    const data = await res.json();
    if(data && data[0] && data[0].summary && data[0].summary.title){
      const title = data[0].summary.title;
      document.getElementById('titleDisplay').textContent = title;
      document.getElementById('titleInput').value = title;
      if(data[0].summary.author){
        document.getElementById('authorInput').value = data[0].summary.author;
      }
    } else {
      // Not in the Japanese database — try Google Books as a fallback,
      // which also covers foreign-language (洋書) titles.
      const found = await lookupBookGoogleBooks(isbn);
      if(!found){
        document.getElementById('titleDisplay').textContent = "見つかりませんでした";
        document.getElementById('titleInput').placeholder = "タイトルを手入力してください";
      }
    }
  }catch(e){
    document.getElementById('titleDisplay').textContent = "検索に失敗しました";
    console.error(e);
  }finally{
    statusEl.style.display = 'none';
    checkDuplicates(document.getElementById('titleInput').value, isbn);
  }
}

// Fallback lookup for foreign-language (洋書) or other books not in
// Japan's openBD database. Returns true if a title was found.
async function lookupBookGoogleBooks(isbn){
  try{
    const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${encodeURIComponent(isbn)}&key=${GOOGLE_BOOKS_API_KEY}`);
    if(!res.ok){
      logDebug(`Google Books応答エラー: HTTP ${res.status}`);
      return false;
    }
    const data = await res.json();
    if(data && data.items && data.items.length > 0){
      const info = data.items[0].volumeInfo || {};
      if(info.title){
        const title = info.subtitle ? `${info.title}: ${info.subtitle}` : info.title;
        document.getElementById('titleDisplay').textContent = title;
        document.getElementById('titleInput').value = title;
        if(info.authors && info.authors.length){
          document.getElementById('authorInput').value = info.authors.join(', ');
        }
        return true;
      }
    } else {
      logDebug(`Google Books: ISBN ${isbn} は見つかりませんでした（totalItems=${data.totalItems ?? '?'}）`);
    }
  }catch(e){
    console.error('Google Books lookup failed', e);
    logDebug('Google Books通信エラー: ' + e.message);
  }
  return false;
}

document.getElementById('saveEntryBtn').addEventListener('click', saveEntry);

async function saveEntry(){
  const title = document.getElementById('titleInput').value.trim();
  const author = document.getElementById('authorInput').value.trim();
  const dateUnknown = document.getElementById('dateUnknownCheck').checked;
  const date = dateUnknown ? '' : document.getElementById('dateInput').value;
  const price = document.getElementById('priceInput').value;
  const place = document.getElementById('placeInput').value.trim();

  if(!title){
    showToast("タイトルを入力してください");
    return;
  }

  const btn = document.getElementById('saveEntryBtn');
  btn.disabled = true;

  const entry = {
    id: 'e_' + Date.now(),
    isbn: currentISBN,
    title: title,
    author: author,
    date: date,
    dateUnknown: dateUnknown,
    price: price,
    place: place,
    source: 'scan',
    createdAt: new Date().toISOString()
  };

  try{
    const result = await bookStorage.set(STORAGE_KEY_PREFIX + entry.id, JSON.stringify(entry), false);
    if(!result){
      showToast("保存に失敗しました");
      btn.disabled = false;
      return;
    }
    document.getElementById('form-modal').classList.remove('open');
    showToast("記録しました");
    loadEntries();
  }catch(e){
    console.error(e);
    showToast("保存に失敗しました");
  }finally{
    btn.disabled = false;
  }
}

let allEntriesCache = [];
let currentFilteredEntries = [];

function isFilterActive(){
  return !!(document.getElementById('searchInput').value.trim() || document.getElementById('yearFilter').value || document.getElementById('monthFilter').value);
}

function clearFilters(){
  document.getElementById('searchInput').value = '';
  document.getElementById('yearFilter').value = '';
  document.getElementById('monthFilter').value = '';
  document.getElementById('searchClearBtn').classList.remove('show');
}

async function refreshCacheThenApplyFilters(){
  const entries = await getAllEntries();
  entries.sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.createdAt||'').localeCompare(a.createdAt||''));
  allEntriesCache = entries;
  populateFilters(entries);
  applyFilters();
}

const GOOGLE_BOOKS_API_KEY = 'AIzaSyAudiKu74HFhcjzzd1IFOnnhe6S5uORgVo';

async function loadEntries(){
  const listArea = document.getElementById('listArea');
  try{
    const entries = await getAllEntries();
    entries.sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.createdAt||'').localeCompare(a.createdAt||''));
    allEntriesCache = entries;
    populateFilters(entries);
    if(entries.length === 0){
      updateCountLabel(entries);
      listArea.innerHTML = '<div class="empty">まだ記録がありません。<br>本のバーコードを読み取って登録しましょう。</div>';
      return;
    }
    renderList(entries);
  }catch(e){
    console.error(e);
    logDebug('loadEntries失敗: ' + e.message);
    listArea.innerHTML = '<div class="empty">読み込みに失敗しました</div>';
  }
}

function renderList(entries){
  const listArea = document.getElementById('listArea');
  currentFilteredEntries = entries;
  updateCountLabel(entries);
  if(entries.length === 0){
    listArea.innerHTML = '<div class="search-empty">見つかりませんでした</div>';
    return;
  }
  listArea.innerHTML = entries.map(renderEntry).join('');
  entries.forEach(en=>{
    const delBtn = document.getElementById('del_' + en.id);
    if(delBtn){
      delBtn.addEventListener('click', ()=>deleteEntry(en.id));
    }
    const titleEl = document.getElementById('title_' + en.id);
    if(titleEl){
      titleEl.addEventListener('click', ()=>openDetailModal(en));
    }
  });
}

function updateCountLabel(entries){
  const countLabel = document.getElementById('countLabel');
  const total = entries.reduce((sum, en)=> sum + (en.price ? Number(en.price) : 0), 0);
  countLabel.textContent = `${entries.length}冊 / 合計¥${total.toLocaleString()}`;
}

function populateFilters(entries){
  const yearSel = document.getElementById('yearFilter');
  const monthSel = document.getElementById('monthFilter');
  const prevYear = yearSel.value, prevMonth = monthSel.value;
  const years = new Set();
  entries.forEach(en=>{
    if(en.dateUnknown) return;
    const m = (en.date||'').match(/^(\d{4})-(\d{2})/);
    if(m) years.add(m[1]);
  });
  const sortedYears = Array.from(years).sort().reverse();
  yearSel.innerHTML = '<option value="">年（すべて）</option>'
    + sortedYears.map(y=>`<option value="${y}">${y}年</option>`).join('')
    + '<option value="unknown">購入日不明</option>';
  monthSel.innerHTML = '<option value="">月（すべて）</option>' + Array.from({length:12},(_,i)=>i+1).map(m=>`<option value="${String(m).padStart(2,'0')}">${m}月</option>`).join('');
  if(prevYear && (sortedYears.includes(prevYear) || prevYear === 'unknown')) yearSel.value = prevYear;
  if(prevMonth) monthSel.value = prevMonth;
}

function applyFilters(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const year = document.getElementById('yearFilter').value;
  const month = document.getElementById('monthFilter').value;
  let filtered = allEntriesCache;
  if(q){
    filtered = filtered.filter(en=>{
      return (en.title||'').toLowerCase().includes(q)
        || (en.author||'').toLowerCase().includes(q)
        || (en.place||'').toLowerCase().includes(q);
    });
  }
  if(year === 'unknown'){
    filtered = filtered.filter(en=> en.dateUnknown);
  } else if(year){
    filtered = filtered.filter(en=> !en.dateUnknown && (en.date||'').startsWith(year + '-'));
    if(month){
      filtered = filtered.filter(en=>{
        const m = (en.date||'').match(/^\d{4}-(\d{2})/);
        return m && m[1] === month;
      });
    }
  } else if(month){
    filtered = filtered.filter(en=>{
      if(en.dateUnknown) return false;
      const m = (en.date||'').match(/^\d{4}-(\d{2})/);
      return m && m[1] === month;
    });
  }
  renderList(filtered);
}

function renderEntry(en){
  const priceText = en.price ? `¥${Number(en.price).toLocaleString()}` : '－';
  const dateText = en.dateUnknown ? '不明' : (en.date || '－');
  const placeText = en.place || '－';
  return `
  <div class="entry">
    <div class="stub"></div>
    <div class="entry-main">
      <div class="entry-title" id="title_${en.id}" style="cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);">${escapeHtml(en.title)}</div>
      <div class="entry-meta">
        <span><b>購入日</b> ${escapeHtml(dateText)}</span>
        <span><b>価格</b> ${escapeHtml(priceText)}</span>
        <span><b>場所</b> ${escapeHtml(placeText)}</span>
        ${en.author ? `<span><b>著者</b> ${escapeHtml(en.author)}</span>` : ''}
      </div>
    </div>
    <button class="del-btn" id="del_${en.id}" title="削除">&times;</button>
  </div>`;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, (m)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function deleteEntry(id){
  if(!confirm('この記録を削除しますか？')) return;
  const filterActive = isFilterActive();
  const wasOnlyOne = currentFilteredEntries.length === 1;
  try{
    await bookStorage.delete(STORAGE_KEY_PREFIX + id, false);
    showToast("削除しました");
    if(filterActive && wasOnlyOne){
      clearFilters();
      loadEntries();
    } else if(filterActive){
      refreshCacheThenApplyFilters();
    } else {
      loadEntries();
    }
  }catch(e){
    console.error(e);
    showToast("削除に失敗しました");
  }
}

// ---- Excel Import ----
document.getElementById('importBtn').addEventListener('click', ()=>{
  document.getElementById('fileInput').click();
});
document.getElementById('fileInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('importStatus');
  statusEl.textContent = "読み込み中…";
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    const monthSheetPattern = /^\d{2}\.\d{2}$/;
    let imported = 0, skipped = 0;

    // gather existing entries to avoid duplicate import
    const existing = await getAllEntries();
    const existingKeySet = new Set(existing.map(en => makeDedupeKey(en.title, en.date, en.price, en.dateIsApprox ? en.sourceSheet : '')));

    for(const sheetName of wb.SheetNames){
      if(!monthSheetPattern.test(sheetName)) continue; // skip summary/other sheets
      const ws = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

      // find header row (contains タイトル)
      let headerIdx = -1, cols = {};
      for(let i=0;i<rows.length;i++){
        const row = rows[i].map(v=>String(v).trim());
        if(row.some(v=>v.includes('タイトル') || v.includes('書名'))){
          headerIdx = i;
          row.forEach((v,j)=>{
            if(v.includes('タイトル') || v.includes('書名')) cols.title = j;
            else if(v.includes('著者')) cols.author = j;
            else if(v.includes('価格') || v.includes('金額')) cols.price = j;
            else if(v.includes('購入場所') || v.includes('購入店舗')) cols.place = j;
            else if(v.includes('購入日')) cols.date = j;
            else if(v === 'ISBN') cols.isbn = j;
          });
          break;
        }
      }
      if(headerIdx === -1 || cols.title === undefined) continue;

      const yearMonth = '20' + sheetName; // "23.08" -> "2023.08"

      for(let i=headerIdx+1;i<rows.length;i++){
        const row = rows[i];
        const rawTitle = row[cols.title];
        if(!rawTitle) continue;
        const title = String(rawTitle).trim();
        if(!title || title === '合計' || title.includes('タイトル')) continue;

        const author = (cols.author !== undefined && row[cols.author]) ? String(row[cols.author]).trim() : '';
        let price = (cols.price !== undefined && row[cols.price] !== '') ? row[cols.price] : '';
        if(typeof price === 'string') price = price.replace(/[^\d.]/g,'');
        const place = (cols.place !== undefined && row[cols.place]) ? String(row[cols.place]).trim() : '';
        const isbn = (cols.isbn !== undefined && row[cols.isbn]) ? String(row[cols.isbn]).trim() : '';
        let dateRaw = (cols.date !== undefined) ? row[cols.date] : '';
        let date = '';
        let dateIsApprox = false;
        if(dateRaw instanceof Date && !isNaN(dateRaw)){
          const y = dateRaw.getFullYear(), mo = String(dateRaw.getMonth()+1).padStart(2,'0'), d = String(dateRaw.getDate()).padStart(2,'0');
          date = `${y}-${mo}-${d}`;
        } else if(dateRaw){
          date = normalizeDate(String(dateRaw).trim(), yearMonth);
        }
        if(!date){
          // No purchase date recorded (common for monthly subscription
          // picture books) — fall back to the 1st of the sheet's month so
          // year/month filtering still works. Marked as approximate.
          const [y, mo] = yearMonth.split('.');
          date = `${y}-${mo}-01`;
          dateIsApprox = true;
        }

        const dedupeKey = makeDedupeKey(title, date, price, dateIsApprox ? sheetName : '');
        if(existingKeySet.has(dedupeKey)){ skipped++; continue; }
        existingKeySet.add(dedupeKey);

        const entry = {
          id: 'e_' + Date.now() + '_' + Math.random().toString(36).slice(2,8),
          isbn,
          title, author, date, price, place,
          source: 'imported',
          sourceSheet: sheetName,
          dateIsApprox,
          createdAt: new Date().toISOString()
        };
        try{
          await bookStorage.set(STORAGE_KEY_PREFIX + entry.id, JSON.stringify(entry), false);
          imported++;
        }catch(err){ console.error(err); }
      }
    }
    statusEl.textContent = `${imported}件を取り込みました（重複${skipped}件はスキップ）`;
    loadEntries();
  }catch(err){
    console.error(err);
    statusEl.textContent = "読み込みに失敗しました。ファイル形式をご確認ください。";
  }finally{
    e.target.value = '';
  }
});

function makeDedupeKey(title, date, price, sheetTag){
  return `${(title||'').trim()}|${(date||'').trim()}|${(price||'').toString().trim()}|${sheetTag||''}`;
}

function normalizeDate(raw, fallbackYearMonth){
  if(!raw) return '';
  // already YYYY-MM-DD or YYYY/MM/DD
  const m1 = raw.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(m1) return `${m1[1]}-${m1[2].padStart(2,'0')}-${m1[3].padStart(2,'0')}`;
  // just a day number, combine with sheet's year-month
  const m2 = raw.match(/^(\d{1,2})$/);
  if(m2 && fallbackYearMonth){
    const [y,mo] = fallbackYearMonth.split('.');
    return `${y}-${mo}-${m2[1].padStart(2,'0')}`;
  }
  return raw;
}

async function getAllEntries(){
  const listResult = await bookStorage.list(STORAGE_KEY_PREFIX, false);
  const keys = (listResult && listResult.keys) ? listResult.keys : [];
  const entries = [];
  // Use the cached copy from list() when available (Firebase) to avoid
  // re-fetching every document individually — cuts read usage roughly in half.
  const getFn = bookStorage.getCached ? bookStorage.getCached : bookStorage.get;
  for(const k of keys){
    try{
      const r = await getFn(k, false);
      if(r && r.value) entries.push(JSON.parse(r.value));
    }catch(e){}
  }
  return entries;
}

// ---- Excel Export ----
document.getElementById('exportBtn').addEventListener('click', exportExcel);

async function exportExcel(){
  const statusEl = document.getElementById('importStatus');
  const btn = document.getElementById('exportBtn');
  btn.disabled = true;
  statusEl.textContent = "書き出し中…";
  try{
    const entries = await getAllEntries();
    if(entries.length === 0){
      statusEl.textContent = "記録がまだありません";
      btn.disabled = false;
      return;
    }

    const groups = {}; // "2026.04" -> [entries]
    const unsorted = [];
    entries.forEach(en=>{
      const m = (en.date||'').match(/^(\d{4})-(\d{2})/);
      if(m){
        const key = `${m[1]}.${m[2]}`;
        if(!groups[key]) groups[key] = [];
        groups[key].push(en);
      } else {
        unsorted.push(en);
      }
    });

    const wb = XLSX.utils.book_new();
    const monthKeys = Object.keys(groups).sort();
    const summaryRows = [['月','冊数','合計金額（円）','平均単価（円）']];

    monthKeys.forEach(key=>{
      const list = groups[key].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
      const sheetRows = [['番号','タイトル','著者','価格（円）','購入場所','購入日']];
      let total = 0, priceCount = 0;
      list.forEach((en,idx)=>{
        const p = en.price ? Number(en.price) : '';
        if(p){ total += p; priceCount++; }
        sheetRows.push([idx+1, en.title||'', en.author||'', p, en.place||'', en.date||'']);
      });
      sheetRows.push(['','合計','','' + total,'','']);
      const ws = XLSX.utils.aoa_to_sheet(sheetRows);
      ws['!cols'] = [{wch:5},{wch:42},{wch:16},{wch:12},{wch:18},{wch:13}];
      const tabName = key.slice(2); // "26.04"
      XLSX.utils.book_append_sheet(wb, ws, tabName);
      summaryRows.push([key, list.length, total, priceCount ? Math.round(total/priceCount) : 0]);
    });

    if(unsorted.length){
      const sheetRows = [['番号','タイトル','著者','価格（円）','購入場所','購入日']];
      unsorted.forEach((en,idx)=>{
        sheetRows.push([idx+1, en.title||'', en.author||'', en.price?Number(en.price):'', en.place||'', en.date||'']);
      });
      const ws = XLSX.utils.aoa_to_sheet(sheetRows);
      ws['!cols'] = [{wch:5},{wch:42},{wch:16},{wch:12},{wch:18},{wch:13}];
      XLSX.utils.book_append_sheet(wb, ws, '日付未入力');
    }

    const grandTotal = monthKeys.reduce((s,k)=>s+groups[k].reduce((s2,en)=>s2+(en.price?Number(en.price):0),0),0);
    const grandCount = entries.length;
    summaryRows.push(['合計', grandCount, grandTotal, '']);
    const summaryWs = XLSX.utils.aoa_to_sheet(summaryRows);
    summaryWs['!cols'] = [{wch:10},{wch:8},{wch:14},{wch:14}];
    XLSX.utils.book_append_sheet(wb, summaryWs, '月別集計');

    const today = new Date();
    const yy = String(today.getFullYear()).slice(2);
    const filename = `絵本リスト_整理済み_${yy}.${today.getMonth()+1}.${String(today.getDate()).padStart(2,'0')}.xlsx`;
    XLSX.writeFile(wb, filename);
    statusEl.textContent = "書き出しました：" + filename;
  }catch(err){
    console.error(err);
    statusEl.textContent = "書き出しに失敗しました";
  }finally{
    btn.disabled = false;
  }
}

// One-time migration: move any books saved locally (from before Firebase
// was connected) up into Firestore, so nothing gets lost in the switch.
async function migrateLocalToFirebaseIfNeeded(){
  const MIGRATION_FLAG = 'book-log-migrated-to-firebase';
  if(localStorage.getItem(MIGRATION_FLAG)) return;
  try{
    const localList = await localBookStorage.list(STORAGE_KEY_PREFIX);
    const localKeys = (localList && localList.keys) ? localList.keys : [];
    if(localKeys.length === 0){
      localStorage.setItem(MIGRATION_FLAG, '1');
      return;
    }
    let migrated = 0;
    for(const k of localKeys){
      try{
        const r = await localBookStorage.get(k);
        if(r && r.value){
          await window.firebaseBookStorage.set(k, r.value);
          migrated++;
        }
      }catch(e){ console.error(e); }
    }
    localStorage.setItem(MIGRATION_FLAG, '1');
    if(migrated > 0) showToast(`${migrated}件をクラウドに移行しました`);
  }catch(e){
    console.error('migration failed', e);
    logDebug('migration失敗: ' + e.message);
  }
}

// If running outside the Claude artifact sandbox (no window.storage),
// switch to Firebase once it's ready so data syncs across devices.
if(!window.storage){
  if(window.firebaseReadyFlag && window.firebaseBookStorage){
    setStatus('Firebase: 準備済み → 移行チェック中');
    bookStorage = window.firebaseBookStorage;
    migrateLocalToFirebaseIfNeeded().then(()=>{ setStatus('Firebase接続中 ✓'); loadEntries(); });
  } else {
    setStatus('Firebase読み込み待ち中... (10秒待って未接続ならタイムアウトします)');
    let switched = false;
    window.addEventListener('firebase-ready', ()=>{
      switched = true;
      setStatus('Firebase: 準備完了 → 移行チェック中');
      bookStorage = window.firebaseBookStorage;
      migrateLocalToFirebaseIfNeeded().then(()=>{ setStatus('Firebase接続中 ✓'); loadEntries(); });
    });
    setTimeout(()=>{
      if(!switched){
        setStatus('⚠️ Firebase未接続（ローカル保存のみ動作中）タップで詳細');
        document.getElementById('statusBar').style.background = '#C1443C';
        document.getElementById('statusBar').style.cursor = 'pointer';
        document.getElementById('statusBar').addEventListener('click', ()=>{
          document.getElementById('debugPanel').style.display = 'block';
        });
      }
    }, 10000);
    // fallback: show local data immediately while waiting, in case Firebase is slow/blocked
    loadEntries();
  }
} else {
  setStatus('Claudeアーティファクト内（ローカル保存モード）');
  loadEntries();
}
</script>
